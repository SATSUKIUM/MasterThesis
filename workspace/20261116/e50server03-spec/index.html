<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>e50server03 実機仕様調査</title></head><body><h1>e50server03 実機仕様調査</h1><p>2026-11-16、ユーザー依頼によりSSHで構成を読み取り、付録Bの仕様表へ反映。現行仕様の根拠は<a href="../../../docs/measurement-environments/20261116-e50server03/README.md">取得記録</a>。メモリはユーザー提供sudo出力に基づく。</p><p>2025年発表資料19ページは測定時の全コア3.2 GHz固定を記載。2026年実機のCPU0はconservative、1.5〜3.2 GHz、boost 0。過去と現在を混同しない。再起動による変更はユーザーの可能性の指摘であり、原因は未確認。</p><p>現行環境が過去の測定時と同一だったことは未検証。論文PDFは生成していない。2026-11-12の参照スナップショットは保持。</p></body></html>
